[package]
name = "rust-web-box"
version = "0.19.0"
edition = "2021"
description = "Rust Web Box: browser-based Rust development with an example CLI"
readme = "README.md"
license = "Unlicense"
keywords = ["rust", "web", "development", "cli"]
categories = ["development-tools"]
repository = "https://github.com/link-foundation/rust-web-box"
documentation = "https://docs.rs/rust-web-box"
rust-version = "1.70"
# Ship the Rust package without browser bundles, case-study images, or CI logs.
include = ["src/**", "examples/**", "tests/**", "scripts/rust-paths.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[lib]
name = "rust_web_box"
path = "src/lib.rs"

[[bin]]
name = "rust-web-box"
path = "src/main.rs"

[dependencies]
lino-arguments = "0.3"
clap = { version = "4.4", features = ["derive", "env"] }

[dev-dependencies]
regex = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allow some common patterns
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
